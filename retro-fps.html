<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Retro FPS - Milestone 1</title>
  <style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0e0e0f;
  color: #b9b7ae;
  font-family: "Courier New", Courier, monospace;
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* The canvas may render at a reduced scale; keep pixels chunky. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  margin: -2px 0 0 -2px;
  background: rgba(220, 220, 210, 0.75);
  pointer-events: none;
}

#fps {
  position: fixed;
  left: 8px;
  top: 6px;
  font-size: 12px;
  color: #8f8d85;
  pointer-events: none;
}

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 9, 0.72);
}

#menu.hidden {
  display: none;
}

.panel {
  width: 340px;
  max-width: calc(100vw - 32px);
  padding: 22px 26px 20px;
  background: #1d1d1f;
  border: 2px solid #55554f;
  box-shadow: 0 0 0 2px #0a0a0a, 6px 6px 0 #0a0a0a;
}

h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 4px;
  color: #c9c6ba;
}

.sub {
  margin: 4px 0 18px;
  font-size: 12px;
  color: #77756e;
}

label {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  margin-bottom: 14px;
  font-size: 13px;
}

label output {
  color: #d0a84a;
}

label input[type="range"] {
  grid-column: 1 / 3;
  width: 100%;
  accent-color: #8a7a4a;
}

button {
  width: 100%;
  padding: 10px 0;
  margin-top: 4px;
  font: inherit;
  font-weight: bold;
  letter-spacing: 2px;
  color: #1a1a1a;
  background: #a89c6a;
  border: 2px solid #55554f;
  cursor: pointer;
}

button:hover {
  background: #c2b57c;
}

.controls {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  font-size: 12px;
  color: #77756e;
  line-height: 1.6;
}

.controls b {
  display: inline-block;
  min-width: 56px;
  color: #b9b7ae;
}
  </style>
</head>
<body>
<canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="fps">-- FPS</div>

  <div id="menu">
    <div class="panel">
      <h1>RETRO FPS</h1>
      <p class="sub">Prototype &middot; Milestone 1</p>

      <label>
        <span>Mouse sensitivity</span>
        <output></output>
        <input type="range" data-setting="sensitivity" min="0.1" max="3" step="0.05">
      </label>
      <label>
        <span>Field of view</span>
        <output></output>
        <input type="range" data-setting="fov" min="60" max="110" step="1">
      </label>
      <label>
        <span>Render scale</span>
        <output></output>
        <input type="range" data-setting="renderScale" min="0.5" max="1" step="0.05">
      </label>

      <button id="play" type="button">CLICK TO PLAY</button>

      <ul class="controls">
        <li><b>WASD</b> move</li>
        <li><b>Mouse</b> look</li>
        <li><b>Shift</b> sprint</li>
        <li><b>Space</b> jump</li>
        <li><b>Esc</b> menu / settings</li>
      </ul>
    </div>
  </div>

  <!-- Three.js r160 (classic build, exposes the global THREE). Loaded from a CDN.
       For fully offline use, save that URL as three.min.js next to this file:
       it is picked up automatically if the CDN is unreachable. -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>window.THREE || document.write('<script src="three.min.js"><\/script>');</script>

  <script>
(function () {
'use strict';

// ===== js/engine/Settings.js =====
const STORAGE_KEY = 'retro-fps.settings.v1';

const LIMITS = {
  sensitivity: { min: 0.1, max: 3 },
  fov: { min: 60, max: 110 },
  renderScale: { min: 0.5, max: 1 },
};

function createDefaults() {
  const coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  return {
    sensitivity: 1,
    fov: 80,
    // Touch devices start at a lower internal resolution.
    renderScale: coarse ? 0.75 : 1,
  };
}

function clamp(key, value) {
  const { min, max } = LIMITS[key];
  return Math.min(max, Math.max(min, value));
}

/** User-adjustable settings, persisted in localStorage. */
class Settings {
  constructor() {
    this.values = createDefaults();
    this._listeners = new Set();
    this._load();
  }

  get(key) {
    return this.values[key];
  }

  set(key, value) {
    if (!(key in LIMITS) || typeof value !== 'number' || Number.isNaN(value)) return;
    const next = clamp(key, value);
    if (next === this.values[key]) return;
    this.values[key] = next;
    this._save();
    for (const listener of this._listeners) listener(key, next);
  }

  /** Subscribe to changes. Returns an unsubscribe function. */
  onChange(listener) {
    this._listeners.add(listener);
    return () => this._listeners.delete(listener);
  }

  _load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      for (const key of Object.keys(LIMITS)) {
        if (typeof saved[key] === 'number' && !Number.isNaN(saved[key])) {
          this.values[key] = clamp(key, saved[key]);
        }
      }
    } catch (_) {
      /* storage unavailable or corrupt: keep defaults */
    }
  }

  _save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.values));
    } catch (_) {
      /* ignore */
    }
  }
}

// ===== js/engine/Engine.js =====
const CLEAR_COLOR = 0x101012;

/**
 * Owns the renderer, scene, camera and main loop.
 * No post-processing, no shadows, no custom shaders.
 */
class Engine {
  constructor(canvas, settings) {
    this.settings = settings;

    this.renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: false,
      alpha: false,
      stencil: false,
      powerPreference: 'high-performance',
    });
    this.renderer.setClearColor(CLEAR_COLOR, 1);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(CLEAR_COLOR);
    this.scene.fog = new THREE.Fog(CLEAR_COLOR, 4, 36);

    this.camera = new THREE.PerspectiveCamera(settings.get('fov'), 1, 0.05, 60);
    // Yaw first, then pitch: the standard FPS camera rotation order.
    this.camera.rotation.order = 'YXZ';

    this._update = null;
    this._running = false;
    this._last = 0;
    this._tick = this._tick.bind(this);

    window.addEventListener('resize', () => this.resize());
    settings.onChange((key, value) => {
      if (key === 'fov') {
        this.camera.fov = value;
        this.camera.updateProjectionMatrix();
      } else if (key === 'renderScale') {
        this.resize();
      }
    });

    this.resize();
  }

  /** Match the canvas to the window, applying the render scale. */
  resize() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    // Never render above CSS-pixel resolution: it keeps the look chunky and
    // spares high-DPI phones. The render scale lowers it further.
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 1) * this.settings.get('renderScale');
    this.renderer.setPixelRatio(pixelRatio);
    this.renderer.setSize(width, height, false);
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
  }

  /** Start the loop. `update(dt)` is called once per frame before rendering. */
  run(update) {
    this._update = update;
    this._running = true;
    this._last = performance.now();
    requestAnimationFrame(this._tick);
  }

  _tick(now) {
    if (!this._running) return;
    requestAnimationFrame(this._tick);
    const dt = Math.min((now - this._last) / 1000, 0.1);
    this._last = now;
    if (this._update) this._update(dt);
    this.renderer.render(this.scene, this.camera);
  }
}

// ===== js/engine/Ui.js =====
const FORMAT = {
  sensitivity: (v) => v.toFixed(2) + 'x',
  fov: (v) => Math.round(v) + '°',
  renderScale: (v) => Math.round(v * 100) + '%',
};

/** Menu, settings sliders, crosshair and FPS counter. Plain DOM, no framework. */
class Ui {
  constructor(settings, input) {
    this.settings = settings;
    this.input = input;

    this.menu = document.getElementById('menu');
    this.crosshair = document.getElementById('crosshair');
    this.fpsLabel = document.getElementById('fps');
    this._frames = 0;
    this._time = 0;

    this._bindSliders();
    document.getElementById('play').addEventListener('click', () => input.requestLock());

    input.onLockChange = (locked) => this._showMenu(!locked);
    this._showMenu(!input.locked);
  }

  updateFps(dt) {
    this._frames++;
    this._time += dt;
    if (this._time >= 0.5) {
      this.fpsLabel.textContent = Math.round(this._frames / this._time) + ' FPS';
      this._frames = 0;
      this._time = 0;
    }
  }

  _showMenu(visible) {
    this.menu.classList.toggle('hidden', !visible);
    this.crosshair.style.display = visible ? 'none' : 'block';
  }

  _bindSliders() {
    const sliders = this.menu.querySelectorAll('input[data-setting]');
    for (const slider of sliders) {
      const key = slider.dataset.setting;
      const output = slider.closest('label').querySelector('output');
      const format = FORMAT[key];

      const refresh = () => {
        const value = this.settings.get(key);
        slider.value = String(value);
        output.textContent = format(value);
      };

      slider.addEventListener('input', () => {
        this.settings.set(key, Number(slider.value));
        refresh();
      });
      refresh();
    }
  }
}

// ===== js/input/Input.js =====
const FORWARD = ['KeyW', 'ArrowUp'];
const BACKWARD = ['KeyS', 'ArrowDown'];
const LEFT = ['KeyA', 'ArrowLeft'];
const RIGHT = ['KeyD', 'ArrowRight'];
const SPRINT = ['ShiftLeft', 'ShiftRight'];
const JUMP = 'Space';

// Keys whose default browser action (scrolling) must be suppressed in play.
const BLOCKED_DEFAULTS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

// Some browsers emit a huge bogus movement delta right after pointer lock.
const MAX_LOOK_DELTA = 200;

/**
 * Keyboard + mouse input with Pointer Lock.
 *
 * Gameplay code reads abstract values (move axes, look delta, sprint, jump)
 * and never touches DOM events. A touch layer can later drive the same state
 * through setVirtualMove / setVirtualSprint / addLook / pressJump.
 */
class Input {
  constructor(element) {
    this.element = element;
    this.locked = false;
    /** Called with `true` / `false` when pointer lock is gained / lost. */
    this.onLockChange = null;

    this._keys = new Set();
    this._lookX = 0;
    this._lookY = 0;
    this._jumpQueued = false;
    this._virtualMove = { x: 0, y: 0 };
    this._virtualSprint = false;

    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);
    this._onMouseMove = this._onMouseMove.bind(this);
    this._onLockChange = this._onLockChange.bind(this);

    document.addEventListener('keydown', this._onKeyDown);
    document.addEventListener('keyup', this._onKeyUp);
    document.addEventListener('mousemove', this._onMouseMove);
    document.addEventListener('pointerlockchange', this._onLockChange);
    document.addEventListener('pointerlockerror', () => {
      console.warn('Pointer lock request failed. Click again in a moment.');
    });
    window.addEventListener('blur', () => this._keys.clear());
    element.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** Ask the browser for pointer lock. Must be called from a user gesture. */
  requestLock() {
    const el = this.element;
    if (!el.requestPointerLock) return;
    try {
      // Raw (unaccelerated) mouse input where supported.
      const result = el.requestPointerLock({ unadjustedMovement: true });
      if (result && typeof result.catch === 'function') {
        result.catch(() => {
          try { el.requestPointerLock(); } catch (_) { /* ignore */ }
        });
      }
    } catch (_) {
      try { el.requestPointerLock(); } catch (__) { /* ignore */ }
    }
  }

  /** Writes strafe (x, right positive) and forward (y, forward positive), each -1..1. */
  getMove(out) {
    let x = (this._down(RIGHT) ? 1 : 0) - (this._down(LEFT) ? 1 : 0) + this._virtualMove.x;
    let y = (this._down(FORWARD) ? 1 : 0) - (this._down(BACKWARD) ? 1 : 0) + this._virtualMove.y;
    out.x = Math.max(-1, Math.min(1, x));
    out.y = Math.max(-1, Math.min(1, y));
    return out;
  }

  /** Writes accumulated look delta in pixels since the last call, then resets it. */
  consumeLook(out) {
    out.x = this._lookX;
    out.y = this._lookY;
    this._lookX = 0;
    this._lookY = 0;
    return out;
  }

  /** True once per jump key press. */
  consumeJump() {
    const queued = this._jumpQueued;
    this._jumpQueued = false;
    return queued;
  }

  get jumpHeld() {
    return this._keys.has(JUMP);
  }

  get sprint() {
    return this._virtualSprint || this._down(SPRINT);
  }

  // --- Hooks for a future touch / gamepad layer ---------------------------

  setVirtualMove(x, y) {
    this._virtualMove.x = x;
    this._virtualMove.y = y;
  }

  setVirtualSprint(active) {
    this._virtualSprint = !!active;
  }

  addLook(dx, dy) {
    this._lookX += Math.max(-MAX_LOOK_DELTA, Math.min(MAX_LOOK_DELTA, dx));
    this._lookY += Math.max(-MAX_LOOK_DELTA, Math.min(MAX_LOOK_DELTA, dy));
  }

  pressJump() {
    this._jumpQueued = true;
  }

  // --- Internals ----------------------------------------------------------

  _down(codes) {
    for (let i = 0; i < codes.length; i++) {
      if (this._keys.has(codes[i])) return true;
    }
    return false;
  }

  _onKeyDown(e) {
    if (!this.locked) return; // gameplay keys are ignored while the menu is open
    if (BLOCKED_DEFAULTS.has(e.code)) e.preventDefault();
    if (e.repeat) return;
    this._keys.add(e.code);
    if (e.code === JUMP) this._jumpQueued = true;
  }

  _onKeyUp(e) {
    this._keys.delete(e.code);
  }

  _onMouseMove(e) {
    if (!this.locked) return;
    this.addLook(e.movementX || 0, e.movementY || 0);
  }

  _onLockChange() {
    const locked = document.pointerLockElement === this.element;
    if (locked === this.locked) return;
    this.locked = locked;
    if (!locked) {
      this._keys.clear();
      this._lookX = 0;
      this._lookY = 0;
      this._jumpQueued = false;
    }
    if (this.onLockChange) this.onLockChange(locked);
  }
}

// ===== js/world/Collision.js =====
/**
 * Static axis-aligned box collision. Pure data and maths: no Three.js here.
 *
 * Brute-force scanning is plenty for the few dozen boxes of the test level.
 * When levels grow, replace the loops in `intersects` / `overlapping` with a
 * uniform grid; the interface can stay the same.
 */
class CollisionWorld {
  constructor() {
    this.boxes = [];
    this._hits = [];
  }

  addBox(minX, minY, minZ, maxX, maxY, maxZ) {
    const box = { minX, minY, minZ, maxX, maxY, maxZ };
    this.boxes.push(box);
    return box;
  }

  /** True if the given AABB overlaps any box (touching faces do not count). */
  intersects(minX, minY, minZ, maxX, maxY, maxZ) {
    const boxes = this.boxes;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (maxX > b.minX && minX < b.maxX &&
          maxY > b.minY && minY < b.maxY &&
          maxZ > b.minZ && minZ < b.maxZ) {
        return true;
      }
    }
    return false;
  }

  /**
   * All boxes overlapping the given AABB. The returned array is reused
   * between calls: read it before the next call.
   */
  overlapping(minX, minY, minZ, maxX, maxY, maxZ) {
    const hits = this._hits;
    hits.length = 0;
    const boxes = this.boxes;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (maxX > b.minX && minX < b.maxX &&
          maxY > b.minY && minY < b.maxY &&
          maxZ > b.minZ && minZ < b.maxZ) {
        hits.push(b);
      }
    }
    return hits;
  }
}

// ===== js/player/Player.js =====
// Player movement and camera control. No rendering-library imports: the
// camera is any object with `position.set(x, y, z)` and `rotation.set(x, y, z)`.

const SKIN = 0.001; // tiny gap left after resolving a collision
const LOOK_RADIANS_PER_PIXEL = 0.0022; // at sensitivity 1.0
const MAX_PITCH = Math.PI / 2 - 0.01;
const MAX_SUBSTEP = 1 / 60; // physics substep so fast movement cannot tunnel

class Player {
  constructor({ camera, input, collision, settings, spawn }) {
    this.camera = camera;
    this.input = input;
    this.collision = collision;
    this.settings = settings;
    this.spawn = spawn;

    // Body (metres). Position is the centre of the feet.
    this.radius = 0.35;
    this.height = 1.8;
    this.eyeHeight = 1.62;

    // Movement tuning.
    this.walkSpeed = 5.0;
    this.sprintSpeed = 8.5;
    this.groundAccel = 55;
    this.airAccel = 14;
    this.jumpSpeed = 7.5; // ~1.1 m jump
    this.gravity = 24;
    this.terminalVelocity = 45;
    this.stepHeight = 0.35; // ledges up to this height are walked over
    this.coyoteTime = 0.1; // jump grace period after leaving a ledge
    this.jumpBufferTime = 0.12; // early jump press is remembered this long

    // State.
    this.x = 0; this.y = 0; this.z = 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.yaw = 0;
    this.pitch = 0;
    this.onGround = false;
    this.sprinting = false;

    this._coyote = 0;
    this._jumpBuffer = 0;
    this._move = { x: 0, y: 0 };
    this._look = { x: 0, y: 0 };

    this.respawn();
  }

  respawn() {
    const s = this.spawn;
    this.x = s.x; this.y = s.y; this.z = s.z;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.yaw = s.yaw || 0;
    this.pitch = 0;
    this.onGround = false;
    this._syncCamera();
  }

  update(dt) {
    dt = Math.min(dt, 0.1);
    const input = this.input;

    // Mouse look.
    input.consumeLook(this._look);
    const k = LOOK_RADIANS_PER_PIXEL * this.settings.get('sensitivity');
    this.yaw -= this._look.x * k;
    this.pitch -= this._look.y * k;
    this.pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, this.pitch));
    this.yaw %= Math.PI * 2;

    // Movement input.
    input.getMove(this._move);
    if (input.consumeJump()) this._jumpBuffer = this.jumpBufferTime;
    this.sprinting = input.sprint && this._move.y > 0.1;

    const steps = Math.max(1, Math.ceil(dt / MAX_SUBSTEP));
    const h = dt / steps;
    for (let i = 0; i < steps; i++) this._step(h);

    if (this.y < -30) this.respawn(); // fell out of the world
    this._syncCamera();
  }

  _step(h) {
    // Jump timing.
    if (this.onGround) this._coyote = this.coyoteTime;
    else this._coyote -= h;
    this._jumpBuffer -= h;

    if (this._coyote > 0 && (this._jumpBuffer > 0 || (this.input.jumpHeld && this.onGround))) {
      this.vy = this.jumpSpeed;
      this.onGround = false;
      this._coyote = 0;
      this._jumpBuffer = 0;
    }

    // Horizontal velocity: move toward the wished velocity.
    let mx = this._move.x;
    let mz = this._move.y;
    const len = Math.hypot(mx, mz);
    if (len > 1) { mx /= len; mz /= len; }
    const hasWish = mx !== 0 || mz !== 0;

    if (this.onGround || hasWish) {
      const speed = this.sprinting ? this.sprintSpeed : this.walkSpeed;
      const sin = Math.sin(this.yaw);
      const cos = Math.cos(this.yaw);
      // Camera looks down -Z at yaw 0; right is +X.
      const targetX = (cos * mx - sin * mz) * speed;
      const targetZ = (-sin * mx - cos * mz) * speed;

      const accel = this.onGround ? this.groundAccel : this.airAccel;
      const dx = targetX - this.vx;
      const dz = targetZ - this.vz;
      const dist = Math.hypot(dx, dz);
      const maxChange = accel * h;
      if (dist <= maxChange) {
        this.vx = targetX;
        this.vz = targetZ;
      } else {
        this.vx += (dx / dist) * maxChange;
        this.vz += (dz / dist) * maxChange;
      }
    }

    // Gravity.
    this.vy -= this.gravity * h;
    if (this.vy < -this.terminalVelocity) this.vy = -this.terminalVelocity;

    // Move one axis at a time so the player slides along walls.
    this._moveX(this.vx * h);
    this._moveZ(this.vz * h);
    this._moveY(this.vy * h);
  }

  _overlapping() {
    const r = this.radius;
    return this.collision.overlapping(
      this.x - r, this.y, this.z - r,
      this.x + r, this.y + this.height, this.z + r
    );
  }

  _moveX(dx) {
    if (dx === 0) return;
    this.x += dx;
    const hits = this._overlapping();
    if (hits.length === 0) return;
    if (this.onGround && this._tryStepUp(hits)) return;
    const r = this.radius;
    for (let i = 0; i < hits.length; i++) {
      const b = hits[i];
      this.x = dx > 0
        ? Math.min(this.x, b.minX - r - SKIN)
        : Math.max(this.x, b.maxX + r + SKIN);
    }
    this.vx = 0;
  }

  _moveZ(dz) {
    if (dz === 0) return;
    this.z += dz;
    const hits = this._overlapping();
    if (hits.length === 0) return;
    if (this.onGround && this._tryStepUp(hits)) return;
    const r = this.radius;
    for (let i = 0; i < hits.length; i++) {
      const b = hits[i];
      this.z = dz > 0
        ? Math.min(this.z, b.minZ - r - SKIN)
        : Math.max(this.z, b.maxZ + r + SKIN);
    }
    this.vz = 0;
  }

  _moveY(dy) {
    this.y += dy;
    const hits = this._overlapping();
    if (hits.length === 0) {
      this.onGround = false;
      return;
    }
    if (dy <= 0) {
      // Landed on top of something.
      let top = -Infinity;
      for (let i = 0; i < hits.length; i++) top = Math.max(top, hits[i].maxY);
      this.y = top;
      this.onGround = true;
    } else {
      // Bumped a ceiling.
      let bottom = Infinity;
      for (let i = 0; i < hits.length; i++) bottom = Math.min(bottom, hits[i].minY);
      this.y = bottom - this.height - SKIN;
      this.onGround = false;
    }
    this.vy = 0;
  }

  /**
   * After a horizontal move ended inside geometry: if everything we hit is a
   * low ledge and there is headroom on top, climb onto it instead of stopping.
   */
  _tryStepUp(hits) {
    let top = this.y;
    for (let i = 0; i < hits.length; i++) top = Math.max(top, hits[i].maxY);
    const rise = top - this.y;
    if (rise <= 0 || rise > this.stepHeight) return false;

    const r = this.radius;
    if (this.collision.intersects(
      this.x - r, top, this.z - r,
      this.x + r, top + this.height, this.z + r
    )) {
      return false;
    }
    this.y = top;
    return true;
  }

  _syncCamera() {
    this.camera.position.set(this.x, this.y + this.eyeHeight, this.z);
    this.camera.rotation.set(this.pitch, this.yaw, 0);
  }
}

// ===== js/world/BoxGeometry.js =====
/**
 * A box whose UVs are scaled to world size, so a texture keeps the same
 * texel density on every face no matter how large the box is.
 * `tile` is the world size in metres covered by one texture repeat.
 */
function createBoxGeometry(width, height, depth, tile) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const uv = geometry.attributes.uv;

  // BoxGeometry face order: +x, -x, +y, -y, +z, -z (4 vertices each).
  const faceSizes = [
    [depth, height], [depth, height],
    [width, depth], [width, depth],
    [width, height], [width, height],
  ];

  for (let face = 0; face < 6; face++) {
    const scaleU = faceSizes[face][0] / tile;
    const scaleV = faceSizes[face][1] / tile;
    for (let i = 0; i < 4; i++) {
      const index = face * 4 + i;
      uv.setXY(index, uv.getX(index) * scaleU, uv.getY(index) * scaleV);
    }
  }
  uv.needsUpdate = true;
  return geometry;
}

// ===== js/world/Textures.js =====
const SIZE = 64;

/** Small deterministic random generator so textures look the same every run. */
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Build a 64x64 texture by calling shade(x, y, rand) -> [r, g, b] per pixel. */
function paint(seed, shade) {
  const canvas = document.createElement('canvas');
  canvas.width = SIZE;
  canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(SIZE, SIZE);
  const data = image.data; // Uint8ClampedArray: values are rounded and clamped
  const rand = mulberry32(seed);

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const c = shade(x, y, rand);
      const i = (y * SIZE + x) * 4;
      data[i] = c[0];
      data[i + 1] = c[1];
      data[i + 2] = c[2];
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.magFilter = THREE.NearestFilter; // chunky pixels up close
  texture.minFilter = THREE.NearestMipmapNearestFilter; // stable at a distance
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 1;
  return texture;
}

/** Procedural, muted, DOOM-ish textures. No image files needed. */
function createTextures() {
  return {
    concrete: paint(1, (x, y, r) => {
      let v = 128 + (r() - 0.5) * 20;
      const q = r();
      if (q < 0.04) v -= 26;
      else if (q > 0.985) v += 20;
      return [v, v, v - 2];
    }),

    floor: paint(2, (x, y, r) => {
      let v = 100 + (r() - 0.5) * 16;
      const gx = x % 32;
      const gy = y % 32;
      if (gx === 0 || gy === 0) v -= 36;
      else if (gx === 1 || gy === 1) v += 8;
      if (r() < 0.03) v -= 20;
      return [v, v, v + 1];
    }),

    panel: paint(3, (x, y, r) => {
      let v = 120 + (r() - 0.5) * 14;
      const gx = x % 32;
      const gy = y % 32;
      if (gx === 0 || gy === 0) v -= 40;
      else if (gx === 1 || gy === 1) v += 10;
      const rivetX = gx === 5 || gx === 6 || gx === 25 || gx === 26;
      const rivetY = gy === 5 || gy === 6 || gy === 25 || gy === 26;
      if (rivetX && rivetY) v += 26;
      if (r() < 0.02) v -= 18;
      return [v, v, v + 2];
    }),

    ceiling: paint(4, (x, y, r) => {
      let v = 88 + (r() - 0.5) * 12;
      if (x % 32 < 2 || y % 32 < 2) v -= 28;
      return [v, v, v + 2];
    }),

    crate: paint(5, (x, y, r) => {
      let k = 1 + (r() - 0.5) * 0.14;
      const edge = x < 4 || x > SIZE - 5 || y < 4 || y > SIZE - 5;
      const diagonal = Math.abs(x - y) < 3 || Math.abs(x + y - (SIZE - 1)) < 3;
      let c = [108, 84, 56];
      if (edge || diagonal) c = [80, 61, 39];
      else if (y % 16 === 0) k *= 0.75;
      if (x === 0 || y === 0 || x === SIZE - 1 || y === SIZE - 1) k *= 0.6;
      return [c[0] * k, c[1] * k, c[2] * k];
    }),

    hazard: paint(6, (x, y, r) => {
      const k = 1 + (r() - 0.5) * 0.12;
      const stripe = ((x + y) >> 3) & 1; // period 16 px: tiles seamlessly
      const c = stripe ? [156, 134, 46] : [40, 40, 38];
      return [c[0] * k, c[1] * k, c[2] * k];
    }),

    barrel: paint(7, (x, y, r) => {
      const k = 1 + (r() - 0.5) * 0.12;
      let c = [76, 90, 66];
      if (y % 16 < 2) c = [50, 58, 46];
      if (r() < 0.06) c = [112, 66, 38];
      return [c[0] * k, c[1] * k, c[2] * k];
    }),
  };
}

// ===== js/world/World.js =====
const HALL_H = 4.5; // wall height
const DOOR_H = 3.0; // doorway height

// World size (metres) covered by one texture repeat.
const TILE = { concrete: 3, floor: 3, panel: 3, ceiling: 3, crate: 1, hazard: 1, lamp: 1 };

/**
 * The static test level: a main hall with pillars, crates and a dais, a low
 * corridor with cover to hop over, and a side room with stairs, a platform
 * and a low beam. All geometry is axis-aligned boxes; every solid is also a
 * collision box.
 */
class World {
  constructor(scene) {
    this.scene = scene;
    this.collision = new CollisionWorld();
    this.spawn = { x: 0, y: 0, z: 7.5, yaw: 0 };

    const textures = createTextures();
    this.materials = {};
    for (const name of Object.keys(textures)) {
      this.materials[name] = new THREE.MeshLambertMaterial({ map: textures[name] });
    }
    this.materials.barrel.flatShading = true;
    this.materials.lamp = new THREE.MeshBasicMaterial({ color: 0xe6dcb8 });

    this._geometries = new Map();
    this._barrelGeometry = null;

    this._buildLighting();
    this._buildHall();
    this._buildCorridor();
    this._buildEastRoom();
  }

  // --- Level ---------------------------------------------------------------

  _buildLighting() {
    // Dim fill light plus a few point lights. No shadows.
    this.scene.add(new THREE.HemisphereLight(0x7a7a82, 0x3a3a38, 2.6));
    this._pointLight(0xffe6bf, 55, 24, 0, 3.9, 0); // hall: warm white
    this._pointLight(0xb8d0b0, 30, 16, 0, 3.0, -20); // corridor: sickly green
    this._pointLight(0xe0a070, 40, 20, 16, 3.9, 0); // east room: amber
  }

  _buildHall() {
    const H = HALL_H;

    this._solid('floor', -11, -1, -11, 11, 0, 11);
    this._solid('ceiling', -11, H, -11, 11, H + 1, 11);

    // South and west walls.
    this._solid('concrete', -11, -1, 10, 11, H, 11);
    this._solid('concrete', -11, -1, -11, -10, H, 10);
    // North wall, doorway x -2..2 (the corridor walls form its jambs).
    this._solid('concrete', -10, -1, -11, -3, H, -10);
    this._solid('concrete', 3, -1, -11, 10, H, -10);
    this._solid('concrete', -2, DOOR_H, -11, 2, H, -10);
    // East wall, doorway z -2..2.
    this._solid('concrete', 10, -1, -11, 11, H, -2);
    this._solid('concrete', 10, -1, 2, 11, H, 10);
    this._solid('concrete', 10, DOOR_H, -2, 11, H, 2);

    this._lamp(-0.6, H - 0.1, -0.6, 0.6, H, 0.6);

    // Pillars with hazard-striped bases (the bases are low ledges to step over).
    const pillars = [[-5, -5], [5, -5], [-5, 5], [5, 5]];
    for (const [px, pz] of pillars) {
      this._solid('hazard', px - 0.8, 0, pz - 0.8, px + 0.8, 0.3, pz + 0.8);
      this._solid('concrete', px - 0.6, 0.3, pz - 0.6, px + 0.6, H, pz + 0.6);
    }

    // Two-tier dais in the middle: step-up test.
    this._solid('panel', -2, 0, -2, 2, 0.3, 2);
    this._solid('concrete', -1, 0.3, -1, 1, 0.6, 1);

    // Jump course: 0.7 m crate, then a 1.4 m crate reachable only from the first.
    this._solid('crate', -9, 0, 2, -8, 0.7, 3);
    this._solid('crate', -8, 0, 2, -7, 1.4, 3);

    // Crate stack.
    this._solid('crate', 6, 0, -6, 7, 1, -5);
    this._solid('crate', 7, 0, -6, 8, 1, -5);
    this._solid('crate', 6.2, 1, -6, 7.2, 2, -5);

    // Barrels.
    this._barrel(-3, 0, -6);
    this._barrel(-2.2, 0, -6.6);
    this._barrel(3.5, 0, 6);
  }

  _buildCorridor() {
    const H = HALL_H;

    this._solid('floor', -2, -1, -30, 2, 0, -11);
    this._solid('ceiling', -2, 3.5, -30, 2, H, -11); // low ceiling: 3.5 m
    this._solid('panel', -3, -1, -31, -2, H, -10);
    this._solid('panel', 2, -1, -31, 3, H, -10);
    this._solid('panel', -2, -1, -31, 2, H, -30);

    this._lamp(-0.4, 3.4, -20.4, 0.4, 3.5, -19.6);

    // Cover to hop over or slalom around.
    this._solid('hazard', -2, 0, -20, 0.5, 1.0, -19.4);
    this._solid('hazard', -0.5, 0, -25, 2, 0.8, -24.4);
  }

  _buildEastRoom() {
    const H = HALL_H;

    this._solid('floor', 11, -1, -7, 23, 0, 7);
    this._solid('ceiling', 11, H, -8, 24, H + 1, 8);
    this._solid('concrete', 11, -1, -8, 24, H, -7);
    this._solid('concrete', 11, -1, 7, 24, H, 8);
    this._solid('concrete', 23, -1, -7, 24, H, 7);

    this._lamp(15.6, H - 0.1, -0.4, 16.4, H, 0.4);

    // Stairs (0.3 m risers), then a 1.2 m platform that is too high to jump onto.
    const risers = [0.3, 0.6, 0.9];
    for (let i = 0; i < risers.length; i++) {
      this._solid('panel', 15 + i, 0, -3, 16 + i, risers[i], 3);
    }
    this._solid('concrete', 18, 0, -7, 23, 1.2, 7);

    // Low beam over the platform: head bump test (clearance 0.2 m, jump bumps it).
    this._solid('concrete', 20, 3.2, -7, 21, 3.8, 7);

    // Props.
    this._solid('crate', 21.5, 1.2, -5.5, 22.5, 2.2, -4.5);
    this._barrel(22, 1.2, 4);
    this._barrel(13, 0, -5);
  }

  // --- Building blocks -----------------------------------------------------

  /** A textured box from (x0,y0,z0) to (x1,y1,z1) that also blocks the player. */
  _solid(kind, x0, y0, z0, x1, y1, z1) {
    this._addBox(kind, x0, y0, z0, x1, y1, z1);
    this.collision.addBox(x0, y0, z0, x1, y1, z1);
  }

  /** Decorative emissive box with no collision. */
  _lamp(x0, y0, z0, x1, y1, z1) {
    this._addBox('lamp', x0, y0, z0, x1, y1, z1);
  }

  _addBox(kind, x0, y0, z0, x1, y1, z1) {
    const w = x1 - x0;
    const h = y1 - y0;
    const d = z1 - z0;
    const mesh = new THREE.Mesh(this._boxGeometry(w, h, d, TILE[kind]), this.materials[kind]);
    mesh.position.set(x0 + w / 2, y0 + h / 2, z0 + d / 2);
    this._freeze(mesh);
    this.scene.add(mesh);
  }

  _barrel(x, y, z) {
    if (!this._barrelGeometry) {
      this._barrelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.1, 8, 1);
    }
    const mesh = new THREE.Mesh(this._barrelGeometry, this.materials.barrel);
    mesh.position.set(x, y + 0.55, z);
    this._freeze(mesh);
    this.scene.add(mesh);
    this.collision.addBox(x - 0.35, y, z - 0.35, x + 0.35, y + 1.1, z + 0.35);
  }

  _pointLight(color, intensity, distance, x, y, z) {
    const light = new THREE.PointLight(color, intensity, distance, 2);
    light.position.set(x, y, z);
    this.scene.add(light);
  }

  /** Boxes of identical size and tiling share one geometry. */
  _boxGeometry(w, h, d, tile) {
    const key = w + '|' + h + '|' + d + '|' + tile;
    let geometry = this._geometries.get(key);
    if (!geometry) {
      geometry = createBoxGeometry(w, h, d, tile);
      this._geometries.set(key, geometry);
    }
    return geometry;
  }

  /** Static meshes never move: compute the matrix once and skip per-frame updates. */
  _freeze(mesh) {
    mesh.updateMatrix();
    mesh.matrixAutoUpdate = false;
  }
}

// ===== js/main.js =====
function boot() {
  const canvas = document.getElementById('game');

  const settings = new Settings();
  const engine = new Engine(canvas, settings);
  const input = new Input(canvas);
  const world = new World(engine.scene);
  const player = new Player({
    camera: engine.camera,
    input,
    collision: world.collision,
    settings,
    spawn: world.spawn,
  });
  const ui = new Ui(settings, input);

  engine.run((dt) => {
    ui.updateFps(dt);
    // The world keeps rendering behind the menu, but the player only
    // simulates while the pointer is locked.
    if (input.locked) player.update(dt);
  });
}

try {
  boot();
} catch (err) {
  console.error(err);
  const msg = document.createElement('pre');
  msg.style.cssText = 'position:fixed;inset:0;margin:0;padding:24px;color:#d0a84a;background:#101012;white-space:pre-wrap;z-index:10';
  msg.textContent = 'Failed to start.\n\n' + (err && err.message ? err.message : err) +
    '\n\nCheck that WebGL is available and that the page is served over http (not file://).';
  document.body.appendChild(msg);
}
})();
  </script>
